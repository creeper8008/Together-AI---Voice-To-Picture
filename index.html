<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>English AI Visualizer - Final Stable</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; max-width: 600px; margin: auto; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        #transcript { font-size: 1.5rem; color: #818cf8; margin: 20px; min-height: 1.2em; border-bottom: 1px solid #334155; }
        #image-container { width: 100%; aspect-ratio: 1/1; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .btn { background: #6366f1; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #475569; }
        #log { font-size: 0.7rem; color: #94a3b8; margin-top: 15px; text-align: left; background: #000; padding: 10px; border-radius: 5px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h3>🎙️ AI Voice Visualizer</h3>
    <input type="password" id="hf-token" placeholder="Enter Hugging Face Token (hf_...)">
    <button id="start-btn" class="btn">Start Listening</button>
    
    <div id="transcript">Speech will appear here...</div>
    
    <div id="image-container">
        <div id="loader" style="display:none;">Generating...</div>
        <img id="generated-image" style="display:none;">
    </div>
    
    <div id="log">System ready. Waiting for start...</div>
</div>

<script>
    const hfInput = document.getElementById('hf-token');
    const startBtn = document.getElementById('start-btn');
    const transcriptDiv = document.getElementById('transcript');
    const imageImg = document.getElementById('generated-image');
    const loader = document.getElementById('loader');
    const logDiv = document.getElementById('log');

    function addLog(msg) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // トークンを保存
    hfInput.value = localStorage.getItem('hf_token_final') || '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;

    startBtn.onclick = () => {
        if (!hfInput.value.trim()) return alert("Enter Token!");
        localStorage.setItem('hf_token_final', hfInput.value.trim());
        recognition.start();
        startBtn.disabled = true;
        startBtn.textContent = "Listening...";
        addLog("Microphone started.");
    };

    recognition.onresult = (event) => {
        const text = event.results[event.results.length - 1][0].transcript.trim();
        transcriptDiv.textContent = text;
        addLog(`Recognized: "${text}"`);
        generateImage(text);
    };

    async function generateImage(prompt) {
        const token = hfInput.value.trim().replace(/[^\x21-\x7E]/g, "");
        loader.style.display = 'block';
        imageImg.style.display = 'none';
        addLog("Sending request to Hugging Face...");

        try {
            // モデルは sdxl-turbo または FLUX.1-schnell を推奨
            const model = "stabilityai/sdxl-turbo"; 
            
            const response = await fetch(
                `https://api-inference.huggingface.co/models/${model}`,
                {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json",
                    },
                    method: "POST",
                    body: JSON.stringify({ 
                        inputs: prompt,
                        options: { wait_for_model: true } 
                    }),
                }
            );

            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`Status ${response.status}: ${errorBody.substring(0, 50)}`);
            }

            const blob = await response.blob();
            if (blob.type.includes("json")) {
                // 画像ではなくエラーメッセージが返ってきた場合
                const text = await blob.text();
                throw new Error("API returned JSON instead of Image: " + text);
            }

            imageImg.src = URL.createObjectURL(blob);
            imageImg.style.display = 'block';
            addLog("Image generated successfully!");
        } catch (e) {
            addLog(`CRITICAL ERROR: ${e.message}`);
            // Failed to fetchが出た場合のヒント
            if (e.message === "Failed to fetch") {
                addLog("Hint: Check AdBlock, VPN, or Network Firewall.");
            }
        } finally {
            loader.style.display = 'none';
        }
    }

    recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
    recognition.onerror = (e) => addLog(`Mic Error: ${e.error}`);
</script>
</body>
</html>
