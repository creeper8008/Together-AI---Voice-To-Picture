<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Voice Visualizer - Together AI Edition</title>
    <style>
        :root { --main: #00f2fe; --bg: #0b0e14; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .setup-box { background: #1a1f29; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { background: #000; border: 1px solid #444; color: var(--main); padding: 12px; border-radius: 8px; width: 80%; font-family: monospace; }
        #transcript { font-size: 2.2rem; font-weight: bold; margin: 25px 0; min-height: 1.5em; color: #fff; text-shadow: 0 0 15px rgba(0,242,254,0.4); }
        .stage { position: relative; width: 100%; max-width: 512px; aspect-ratio: 1/1; margin: auto; background: #000; border-radius: 20px; border: 2px solid #333; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .btn { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000; border: none; padding: 18px 60px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.3rem; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--main); }
        #log { margin-top: 20px; color: #666; font-family: monospace; font-size: 0.8rem; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 5px solid #222; border-top: 5px solid var(--main); border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="setup-box">
        <input type="password" id="api-key" placeholder="Together AI Key (Starts with digits/letters)">
        <p style="font-size:0.7rem; color:#888; margin:5px 0 0 0;">Together AIのAPIキーを入力してください</p>
    </div>

    <button id="start-btn" class="btn">START EXHIBITION</button>
    
    <div id="transcript">Ready to paint with your voice...</div>

    <div class="stage">
        <div id="loader" class="loader"></div>
        <img id="result-img">
    </div>

    <div id="log">System: Ready</div>
</div>

<script>
    const keyInput = document.getElementById('api-key');
    const startBtn = document.getElementById('start-btn');
    const transcriptDiv = document.getElementById('transcript');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');
    const logDiv = document.getElementById('log');

    keyInput.value = localStorage.getItem('together_key') || '';

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = true;

    startBtn.onclick = () => {
        if(!keyInput.value) return alert("API Keyを入力してください！");
        localStorage.setItem('together_key', keyInput.value.trim());
        recognition.start();
        startBtn.disabled = true;
        startBtn.textContent = "🎤 LISTENING";
        logDiv.textContent = "Status: Microphone Active";
    };

    recognition.onresult = (event) => {
        const text = event.results[event.results.length - 1][0].transcript.trim();
        transcriptDiv.textContent = text;
        generateImage(text);
    };

    async function generateImage(prompt) {
        loader.style.display = 'block';
        logDiv.textContent = "Status: Generating high-speed AI image...";
        
        try {
            const response = await fetch("https://api.together.xyz/v1/images/generations", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${keyInput.value.trim()}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    // 展示会に最適な最高画質・爆速モデル
                    model: "black-forest-labs/FLUX.1-schnell",
                    prompt: prompt + ", vivid colors, masterpiece, highly detailed",
                    width: 1024,
                    height: 1024,
                    steps: 4, // Schnellモデルの推奨
                    n: 1
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `HTTP ${response.status}`);
            }

            if (data.data && data.data[0]) {
                resultImg.src = data.data[0].url;
                resultImg.style.display = 'block';
                logDiv.textContent = "Status: Success! Image Generated.";
            }
        } catch (e) {
            logDiv.textContent = "Error: " + e.message;
            console.error(e);
        } finally {
            loader.style.display = 'none';
        }
    }

    recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
</script>
</body>
</html>
