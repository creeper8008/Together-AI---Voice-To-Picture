<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Visualizer - Debug Edition</title>
    <style>
        :root { --accent: #00ffcc; --bg: #0d1117; }
        body { font-family: sans-serif; background: var(--bg); color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .setup-box { background: #161b22; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { background: #000; border: 1px solid #444; color: var(--accent); padding: 10px; border-radius: 6px; width: 80%; font-family: monospace; }
        #transcript { font-size: 1.8rem; font-weight: bold; margin: 20px 0; min-height: 2em; color: #fff; }
        .stage { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 15px; border: 2px solid #333; overflow: hidden; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        /* 診断ログ：ここが重要 */
        #debug-console { margin-top: 20px; text-align: left; background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 5px; height: 100px; overflow-y: auto; border: 1px solid #222; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid #222; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ AI Visualizer</h1>
        <div class="setup-box">
            <input type="password" id="api-key" placeholder="Paste sk-... key here">
        </div>
        <button id="start-btn" class="btn">START SESSION</button>
        <div id="transcript">Speech will appear here...</div>
        <div class="stage">
            <div id="loader" class="loader"></div>
            <img id="result-img">
        </div>
        <div id="debug-console">> System ready. Enter key and press Start.<br></div>
    </div>

    <script>
        const keyInput = document.getElementById('api-key');
        const startBtn = document.getElementById('start-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');
        const debugConsole = document.getElementById('debug-console');

        keyInput.value = localStorage.getItem('sf_key_debug') || '';

        function log(msg) {
            debugConsole.innerHTML += `> ${msg}<br>`;
            debugConsole.scrollTop = debugConsole.scrollHeight;
            console.log(msg);
        }

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = true;

        startBtn.onclick = () => {
            const key = keyInput.value.trim();
            if(!key.startsWith('sk-')) return alert("Invalid Key!");
            localStorage.setItem('sf_key_debug', key);
            recognition.start();
            startBtn.disabled = true;
            startBtn.textContent = "Listening...";
            log("Microphone started.");
        };

        recognition.onresult = (event) => {
            const text = event.results[event.results.length - 1][0].transcript.trim();
            transcriptDiv.textContent = text;
            log(`Heard: "${text}"`);
            generateImage(text);
        };

        async function generateImage(prompt, model = "black-forest-labs/FLUX.1-schnell") {
            loader.style.display = 'block';
            log(`Requesting model: ${model.split('/').pop()}...`);

            try {
                const response = await fetch("https://api.siliconflow.cn/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${keyInput.value.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: prompt,
                        image_size: "1024x1024",
                        batch_size: 1,
                        num_inference_steps: (model.includes("FLUX")) ? 4 : 1
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    // ここでエラーの正体を暴く
                    const errMsg = data.message || JSON.stringify(data);
                    log(`API ERROR (${response.status}): ${errMsg}`);
                    
                    // もしモデルが見つからない系のエラーなら、一度だけ予備モデルで試す
                    if (model.includes("FLUX")) {
                        log("Retrying with backup model (SDXL)...");
                        return generateImage(prompt, "stabilityai/sdxl-turbo");
                    }
                    return;
                }

                if (data.images && data.images[0]) {
                    resultImg.src = data.images[0].url;
                    resultImg.style.display = 'block';
                    log("SUCCESS: Image updated.");
                }
            } catch (e) {
                log("FETCH ERROR: " + e.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
    </script>
</body>
</html>
