<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Voice AI Canvas - Resilient Free Version</title>
    <style>
        /* UIデザインは踏襲しつつ、ステータス表示を強化 */
        body { font-family: 'Inter', sans-serif; background: #0a0a0c; color: #e2e8f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #container { background: #161b22; padding: 30px; border-radius: 24px; width: 90%; max-width: 500px; text-align: center; border: 1px solid #30363d; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        h1 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 20px; text-transform: uppercase; }
        #btn { background: #238636; color: white; border: none; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        #btn.listening { background: #da3633; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        #transcript-box { height: 60px; margin: 15px 0; font-size: 18px; color: #c9d1d9; font-style: italic; }
        #status-bar { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-bottom: 10px; }
        #img-container { width: 100%; aspect-ratio: 1/1; background: #0d1117; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; border: 1px solid #30363d; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .loader { width: 40px; height: 40px; border: 4px solid #30363d; border-top: 4px solid #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="container">
    <h1>Voice Image Factory</h1>
    <button id="btn">🎤 CLICK TO SPEAK</button>
    <div id="transcript-box">"A futuristic energy drink"</div>
    
    <div id="status-bar">
        <span id="engine-info">Engine: Auto-Select</span>
        <span id="timer">Wait: --s</span>
    </div>

    <div id="img-container">
        <div id="loader" class="loader" style="display:none;"></div>
        <img id="result-img" src="" alt="Result">
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const transcriptDiv = document.getElementById('transcript-box');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');
    const timerStatus = document.getElementById('timer');
    const engineInfo = document.getElementById('engine-info');

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new Speech();
    recognition.lang = 'en-US';

    btn.onclick = () => { try { recognition.start(); btn.classList.add('listening'); btn.textContent = '🛑 LISTENING...'; } catch(e){} };

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        transcriptDiv.textContent = `"${text}"`;
        startGenerationProcess(text);
    };

    recognition.onend = () => { btn.classList.remove('listening'); btn.textContent = '🎤 CLICK TO SPEAK'; };

    let startTime;
    let timerInterval;

    function startGenerationProcess(prompt) {
        resultImg.style.display = 'none';
        loader.style.display = 'block';
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timerStatus.textContent = `Wait: ${((Date.now() - startTime)/1000).toFixed(1)}s`;
        }, 100);

        tryPollinations(prompt);
    }

    // --- メイン：Pollinations (無料) ---
    function tryPollinations(prompt) {
        engineInfo.textContent = "Engine: Pollinations (Free)";
        const seed = Math.floor(Math.random() * 1000000);
        // パラメータを削って最軽量化
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&seed=${seed}&nologo=true`;

        const img = new Image();
        img.src = url;

        // 10秒経っても反応がなければ、別のシードでリトライ（裏技）
        const timeout = setTimeout(() => {
            console.log("Slow connection, trying different seed...");
            tryPollinations(prompt); 
        }, 15000);

        img.onload = () => {
            clearTimeout(timeout);
            displayImage(url);
        };
        img.onerror = () => {
            clearTimeout(timeout);
            engineInfo.textContent = "Rate Limit! Retrying...";
            setTimeout(() => tryPollinations(prompt), 3000);
        };
    }

    function displayImage(url) {
        clearInterval(timerInterval);
        resultImg.src = url;
        resultImg.style.display = 'block';
        loader.style.display = 'none';
        engineInfo.textContent = "✅ Success";
    }
</script>
</body>
</html>
