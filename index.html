<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Instant AI Visualizer</title>
    <style>
        :root { --main: #00ff88; --bg: #050505; }
        body { font-family: sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 20px; }
        .box { max-width: 600px; margin: auto; background: #111; padding: 30px; border-radius: 20px; border: 1px solid #222; }
        #transcript { font-size: 1.8rem; height: 3em; margin: 20px 0; color: var(--main); font-weight: bold; }
        .view { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid #333; }
        img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .btn { background: var(--main); color: black; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        .btn:disabled { background: #333; color: #666; }
        #log { font-size: 0.8rem; color: #555; margin-top: 15px; font-family: monospace; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid #222; border-top: 4px solid var(--main); border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <input type="password" id="api-key" placeholder="SiliconFlow Key (sk-...)" style="width:80%; padding:10px; margin-bottom:10px; background:#000; color:#fff; border:1px solid #333;">
    <br>
    <button id="start-btn" class="btn">START SESSION</button>
    <div id="transcript">Waiting for speech...</div>
    <div class="view">
        <div id="loader" class="loader"></div>
        <img id="result-img">
    </div>
    <div id="log">Status: Ready</div>
</div>

<script>
    const keyInput = document.getElementById('api-key');
    const startBtn = document.getElementById('start-btn');
    const transcriptDiv = document.getElementById('transcript');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');
    const logDiv = document.getElementById('log');

    keyInput.value = localStorage.getItem('sf_key') || '';

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = true;

    startBtn.onclick = () => {
        if(!keyInput.value) return alert("API Key!");
        localStorage.setItem('sf_key', keyInput.value);
        recognition.start();
        startBtn.disabled = true;
        startBtn.textContent = "🎤 Listening...";
    };

    recognition.onresult = (event) => {
        const text = event.results[event.results.length - 1][0].transcript.trim();
        transcriptDiv.textContent = text;
        generate(text);
    };

    async function generate(prompt) {
        loader.style.display = 'block';
        const start = Date.now();
        logDiv.textContent = "Status: Generating...";

        try {
            const response = await fetch("https://api.siliconflow.cn/v1/images/generations", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${keyInput.value.trim()}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "stabilityai/sdxl-turbo", // 爆速モデル
                    prompt: prompt,
                    batch_size: 1,
                    guidance_scale: 1 // Turboモデル用の設定
                })
            });

            const data = await response.json();
            
            if (data.images && data.images[0]) {
                resultImg.src = data.images[0].url;
                resultImg.style.display = 'block';
                const time = ((Date.now() - start)/1000).toFixed(2);
                logDiv.textContent = `Status: Success (${time}s)`;
            } else {
                throw new Error(data.message || "API Error");
            }
        } catch (e) {
            logDiv.textContent = "Error: " + e.message;
            // 予備（Pollinations）を一応残すが、基本はSiliconFlowで完結
        } finally {
            loader.style.display = 'none';
        }
    }

    recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
</script>
</body>
</html>
