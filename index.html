<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Super Fast AI Visualizer</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        #transcript { font-size: 2rem; color: #00ffcc; margin: 20px; min-height: 1.2em; }
        .display { width: 100%; max-width: 512px; aspect-ratio: 1/1; margin: auto; border: 2px solid #333; position: relative; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        .btn { padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; background: #00ffcc; border: none; cursor: pointer; font-weight: bold; }
        #log { font-size: 0.8rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎙️ Speed AI Painter</h1>
    <button id="start-btn" class="btn">Start Session</button>
    <div id="transcript">Ready...</div>

    <div class="display">
        <div id="loader" class="loader">Generating...</div>
        <img id="generated-image" src="">
    </div>
    <div id="log">Status: Standby</div>

    <script>
        // --- 設定 ---
        const TOGETHER_API_KEY = "あなたのAPIキーをここに貼る";
        // --- --- ---

        const startBtn = document.getElementById('start-btn');
        const transcriptDiv = document.getElementById('transcript');
        const imageImg = document.getElementById('generated-image');
        const loader = document.getElementById('loader');
        const logDiv = document.getElementById('log');

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = true;

        startBtn.onclick = () => {
            recognition.start();
            startBtn.style.display = 'none';
            logDiv.textContent = "Status: Listening...";
        };

        recognition.onresult = async (event) => {
            const text = event.results[event.results.length - 1][0].transcript.trim();
            transcriptDiv.textContent = text;
            generateTogetherAI(text);
        };

        async function generateTogetherAI(prompt) {
            loader.style.display = 'block';
            const startTime = Date.now();

            try {
                const response = await fetch("https://api.together.xyz/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${TOGETHER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // 爆速モデル SDXL Lightning を指定
                        model: "stabilityai/sdxl-lightning",
                        prompt: prompt + ", high quality, 4k",
                        width: 512,
                        height: 512,
                        steps: 1, // 1ステップで生成するので超速い
                        n: 1
                    })
                });

                const data = await response.json();
                if (data.data && data.data[0]) {
                    imageImg.src = data.data[0].url;
                    const duration = (Date.now() - startTime) / 1000;
                    logDiv.textContent = `Status: Generated in ${duration}s!`;
                }
            } catch (e) {
                logDiv.textContent = "Error: " + e.message;
            } finally {
                loader.style.display = 'none';
            }
        }

        recognition.onend = () => recognition.start();
    </script>
</body>
</html>
