<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fast AI Visualizer - SiliconFlow</title>
    <style>
        :root { --accent: #00ff88; --bg: #0d1117; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        .container { width: 90vw; max-width: 900px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: var(--accent); letter-spacing: 1px; }

        /* 入力エリア */
        .setup { background: #161b22; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { background: #000; border: 1px solid #444; color: var(--accent); padding: 10px; border-radius: 6px; width: 300px; font-family: monospace; }
        
        /* 表示エリア */
        #transcript { font-size: 2rem; font-weight: bold; margin: 20px 0; min-height: 1.5em; color: #fff; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .canvas { position: relative; width: 100%; max-width: 512px; aspect-ratio: 1/1; margin: auto; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid #30363d; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* ボタンとステータス */
        .btn { background: var(--accent); color: #000; border: none; padding: 15px 50px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }
        .btn:disabled { background: #333; color: #666; cursor: default; transform: none; box-shadow: none; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #8b949e; }

        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid #222; border-top: 4px solid var(--accent); border-radius: 50%; width: 50px; height: 50px; animation: spin 0.7s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI <span>VOICE PAINTER</span></h1>

        <div class="setup">
            <input type="password" id="api-key" placeholder="Enter SiliconFlow Key (sk-...)">
            <p style="font-size: 0.7rem; color: #666; margin: 5px 0 0 0;">※Keyはブラウザに保存されます</p>
        </div>

        <button id="start-btn" class="btn">START SESSION</button>
        
        <div id="transcript">Ready to listen...</div>

        <div class="canvas">
            <div id="loader" class="loader"></div>
            <img id="result-img" src="">
        </div>

        <div id="status">Status: Waiting for start</div>
    </div>

    <script>
        const keyInput = document.getElementById('api-key');
        const startBtn = document.getElementById('start-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');

        // キーを保存・復元
        keyInput.value = localStorage.getItem('sf_key_v2') || '';

        // 音声認識のセットアップ
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;

        startBtn.onclick = () => {
            if(!keyInput.value.startsWith('sk-')) return alert("正しいAPIキーを入力してください。");
            localStorage.setItem('sf_key_v2', keyInput.value);
            
            try {
                recognition.start();
                startBtn.disabled = true;
                startBtn.textContent = "🎤 LISTENING";
                statusDiv.textContent = "Status: Microphone active";
            } catch(e) {
                statusDiv.textContent = "Status: Mic Error " + e.message;
            }
        };

        recognition.onresult = (event) => {
            const text = event.results[event.results.length - 1][0].transcript.trim();
            if (text.length < 2) return;
            transcriptDiv.textContent = text;
            generateImage(text);
        };

        async function generateImage(prompt) {
            loader.style.display = 'block';
            const startTime = performance.now();
            const apiKey = keyInput.value.trim();

            try {
                const response = await fetch("https://api.siliconflow.cn/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "stabilityai/sdxl-turbo", // 展示に最適な爆速モデル
                        prompt: prompt + ", high quality, detailed art",
                        batch_size: 1,
                        num_inference_steps: 1, // これが速さの秘密です
                        guidance_scale: 1
                    })
                });

                const data = await response.json();
                
                if (data.images && data.images[0]) {
                    // 画像のURLをセットして表示
                    resultImg.src = data.images[0].url;
                    resultImg.style.display = 'block';
                    
                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    statusDiv.textContent = `Status: Success in ${duration}s`;
                } else {
                    statusDiv.textContent = "Status: API Error " + (data.message || "Unknown");
                }
            } catch (e) {
                statusDiv.textContent = "Status: Network Error";
                console.error(e);
            } finally {
                loader.style.display = 'none';
            }
        }

        // 自動再開
        recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
    </script>
</body>
</html>
