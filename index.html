<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Painter - Exhibition Pro</title>
    <style>
        /* 色の設定：赤をやめて、温かみのある黄色（ゴールド）を追加 */
        :root { --accent: #00f2fe; --bg: #000000; --danger: #ff4b2b; --warning: #ffd700; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        .container { display: flex; height: 100vh; width: 100vw; }
        
        /* 左側：巨大画像エリア (16:9) */
        .image-container { flex: 7.5; display: flex; align-items: center; justify-content: center; position: relative; background: #050505; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #result-img.active { display: block; animation: fadeIn 0.8s ease; }

        /* 右側：制御パネル */
        .ui-container { flex: 2.5; background: #111; display: flex; flex-direction: column; padding: 30px; border-left: 1px solid #222; }
        
        /* テキスト表示エリア */
        #transcript { 
            font-size: 2.2rem; font-weight: 800; line-height: 1.2; color: #444; 
            margin-bottom: 20px; flex-grow: 1; overflow-y: auto; word-break: break-word; 
            transition: color 0.3s ease;
        }
        #transcript.active { color: var(--accent); }
        /* 新しい設定：未設定時のマイルドな警告色 */
        #transcript.warning { color: var(--warning); font-size: 1.8rem; }

        .control-panel { padding-top: 20px; }
        
        /* トグルボタン */
        .toggle-btn { 
            width: 100%; padding: 30px 20px; border-radius: 15px; border: 2px solid #333; 
            background: #222; color: #666; font-size: 1.4rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        .toggle-btn.on { 
            background: var(--danger); color: white; border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.4);
            animation: pulse 2s infinite;
        }

        #status-msg { margin-top: 15px; font-size: 0.8rem; color: #333; font-family: monospace; text-align: center; }

        /* 隠し設定アイコン (Shift+K) */
        #config-trigger { 
            position: fixed; bottom: 10px; left: 10px; opacity: 0.1; 
            cursor: pointer; z-index: 100; font-size: 20px; color: #444; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 75, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); } }
        
        #loader { display:none; position:absolute; z-index:10; background:rgba(0,0,0,0.7); color:var(--accent); padding:20px 40px; border-radius:50px; font-weight:bold; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <div id="loader">🎨 Generating...</div>
            <img id="result-img" src="">
        </div>

        <div class="ui-container">
            <div style="font-size: 0.8rem; color: #444; margin-bottom: 5px;">LIVE TRANSCRIPT</div>
            <div id="transcript">Ready to Start</div>
            
            <div class="control-panel">
                <button id="toggle-btn" class="toggle-btn">AUTO GENERATION: OFF</button>
                <div id="status-msg">Together AI | FLUX.1-schnell | 1344x768</div>
            </div>
        </div>
    </div>

    <div id="config-trigger">⚙️</div>

    <script>
        const toggleBtn = document.getElementById('toggle-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');

        let isAutoMode = false;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;

        // 起動時のAPIキーチェック（マイルドな表示に変更）
        window.onload = () => {
            const key = localStorage.getItem('event_api_key');
            if (!key || key.length < 5) {
                // 赤字をやめ、専用のクラスを付与してテキストを変更
                transcriptDiv.textContent = "ℹ️ Setup Required\nPlease press [Shift + K] to configure API Key.";
                transcriptDiv.classList.add('warning'); 
            }
        };

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key.toLowerCase() === 'k') {
                openConfig();
            }
            if (e.key === 'Enter') {
                toggleBtn.click();
            }
        });

        // 設定画面
        function openConfig() {
            const currentKey = localStorage.getItem('event_api_key') || "";
            const newKey = prompt("Together AIのAPIキーを入力してください:", currentKey);
            if (newKey !== null) {
                localStorage.setItem('event_api_key', newKey);
                alert("APIキーを保存しました。画面を更新します。");
                location.reload();
            }
        }
        document.getElementById('config-trigger').onclick = openConfig;

        // ON/OFF切り替え
        toggleBtn.onclick = () => {
            const key = localStorage.getItem('event_api_key');
            if (!key || key.length < 5) {
                openConfig();
                return;
            }

            if (!isAutoMode) {
                startMode();
            } else {
                stopMode();
            }
        };

        function startMode() {
            isAutoMode = true;
            transcriptDiv.classList.remove('warning'); // 警告色を解除
            toggleBtn.textContent = "AUTO GENERATION: ON";
            toggleBtn.classList.add('on');
            transcriptDiv.textContent = "Listening for English...";
            transcriptDiv.classList.add('active');
            try { recognition.start(); } catch (e) {}
        }

        function stopMode() {
            isAutoMode = false;
            toggleBtn.textContent = "AUTO GENERATION: OFF";
            toggleBtn.classList.remove('on');
            transcriptDiv.textContent = "System Paused";
            transcriptDiv.classList.remove('active');
            recognition.stop();
        }

        // 音声認識
        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                transcriptDiv.textContent = finalTranscript;
                generateImage(finalTranscript);
            }
        };

        // 画像生成
        async function generateImage(prompt) {
            if (!isAutoMode) return;
            loader.style.display = 'block';
            try {
                const response = await fetch("https://api.together.xyz/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem('event_api_key')}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "black-forest-labs/FLUX.1-schnell",
                        prompt: prompt + ", masterpiece, high quality, 4k",
                        width: 1344,
                        height: 768,
                        steps: 4,
                        n: 1
                    })
                });
                const data = await response.json();
                if (data.data && data.data[0]) {
                    resultImg.src = data.data[0].url;
                    resultImg.classList.add('active');
                }
            } catch (e) {
                
    transcriptDiv.textContent = "Oops! Try saying it again."; // 「もう一度言ってみて！」と出す
    transcriptDiv.style.color = "var(--warning)"; 
}
            } finally {
                loader.style.display = 'none';
            }
        }

        // 自動再開
        recognition.onend = () => {
            if (isAutoMode) {
                try { recognition.start(); } catch (e) {}
            }
        };
    </script>
</body>
</html>
