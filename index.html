<script>
    async function generateImage(prompt) {
        loader.style.display = 'block';
        const apiKey = keyInput.value.trim();
        statusDiv.textContent = "Status: Connecting to SiliconFlow...";

        try {
            const response = await fetch("https://api.siliconflow.cn/v1/images/generations", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                    "Accept": "application/json" // これを追加
                },
                body: JSON.stringify({
                    // 最速かつ最高画質のFLUXモデルに変更
                    model: "black-forest-labs/FLUX.1-schnell", 
                    prompt: prompt,
                    image_size: "1024x1024",
                    batch_size: 1,
                    num_inference_steps: 4 // FLUX.1-schnellの推奨ステップ数
                })
            });

            // エラーの詳細を掴むための処理
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const errorMsg = errorData.message || `HTTP Error ${response.status}`;
                throw new Error(errorMsg);
            }

            const data = await response.json();
            
            if (data.images && data.images[0] && data.images[0].url) {
                resultImg.src = data.images[0].url;
                resultImg.style.display = 'block';
                statusDiv.textContent = "Status: Success!";
            } else {
                throw new Error("No image in response");
            }
        } catch (e) {
            // ここで本当のエラー原因がわかります
            statusDiv.textContent = "Status Error: " + e.message;
            console.error("Full Error:", e);
            
            // もし「Model not found」系なら予備で表示
            if(e.message.includes("model")) {
                statusDiv.textContent = "Status: Model naming error. Trying fallback...";
            }
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
