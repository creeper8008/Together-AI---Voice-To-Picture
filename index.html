<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Speed AI Generator</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #121212; color: white; margin: 0; }
        #container { background: #1e1e1e; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 700px; border: 1px solid #333; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 20px; color: #00d4ff; }
        
        #btn { background: linear-gradient(135deg, #00d4ff 0%, #0072ff 100%); color: white; border: none; padding: 25px; border-radius: 50px; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,212,255,0.3); }
        #btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,212,255,0.5); }
        #btn.listening { background: #ff4b2b; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
        
        #transcript-box { min-height: 60px; font-size: 22px; color: #fff; margin: 20px 0; font-style: italic; opacity: 0.9; }
        #status { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        
        #img-container { width: 100%; aspect-ratio: 1/1; background: #2a2a2a; border-radius: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .loader { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="container">
    <h1>VOICE AI TURBO</h1>
    <button id="btn">🎤 Click & Speak</button>
    <div id="transcript-box">"What will you create?"</div>
    <div id="status">Ready to generate in 3-5 seconds</div>
    <div id="img-container">
        <div id="loader" class="loader"></div>
        <img id="result-img" src="" alt="Result">
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript-box');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new Speech();
    recognition.lang = 'en-US';

    btn.onclick = () => {
        try { recognition.start(); } catch(e) {}
        btn.classList.add('listening');
        btn.textContent = '🛑 LISTENING...';
    };

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        transcriptDiv.textContent = `"${text}"`;
        generateImage(text);
    };

    recognition.onend = () => {
        btn.classList.remove('listening');
        btn.textContent = '🎤 Click & Speak';
    };

    async function generateImage(prompt, retryCount = 0) {
        status.textContent = retryCount > 0 ? `🔄 Retrying (${retryCount})...` : '🚀 Generating...';
        resultImg.style.display = 'none';
        loader.style.display = 'block';

        const seed = Math.floor(Math.random() * 1000000);
        // ★ 高速化の鍵: model=turbo を使用。コンプラにも比較的寛容で爆速。
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&model=turbo&nologo=true`;

        const img = new Image();
        img.src = imageUrl;

        img.onload = () => {
            // Pollinationsの「エラー画像」は特定のサイズや特徴を持つことが多いため
            // ここで簡易的なチェックを入れることも可能ですが、基本はそのまま表示します。
            resultImg.src = imageUrl;
            resultImg.style.display = 'block';
            loader.style.display = 'none';
            status.textContent = '✅ Success';
        };

        img.onerror = () => {
            if (retryCount < 3) {
                setTimeout(() => generateImage(prompt, retryCount + 1), 1000);
            } else {
                loader.style.display = 'none';
                status.textContent = '❌ Error. Please try again.';
            }
        };
    }
</script>
</body>
</html>
