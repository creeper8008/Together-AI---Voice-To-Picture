<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Painter - Exhibition Pro</title>
    <style>
        :root { 
            --accent: #00f2fe; 
            --bg: #000000; 
            --danger: #ff4b2b; 
            --warning: #ffd700; 
            --text-dim: #444;
        }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        .container { display: flex; height: 100vh; width: 100vw; }
        
        /* 左側：画像エリア */
        .image-container { 
            flex: 7.5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background: #050505; 
        }
        
        #result-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
        }
        
        #result-img.active { 
            display: block; 
            animation: fadeIn 0.8s ease-in-out; 
        }

        /* 右側：パネルエリア */
        .ui-container { 
            flex: 2.5; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            padding: 30px; 
            border-left: 1px solid #222; 
        }
        
        #transcript { 
            font-size: 2.2rem; 
            font-weight: 800; 
            line-height: 1.2; 
            color: var(--text-dim); 
            margin-bottom: 20px; 
            flex-grow: 1; 
            overflow-y: auto; 
            word-break: break-word; 
            transition: all 0.2s ease;
        }
        
        /* 正常動作時の色（水色） */
        #transcript.active { color: var(--accent); }
        
        /* エラー・警告時の色（黄色） */
        #transcript.warning { color: var(--warning); font-size: 1.6rem; }

        .control-panel { padding-top: 20px; border-top: 1px solid #222; }
        
        .toggle-btn { 
            width: 100%; 
            padding: 30px 20px; 
            border-radius: 15px; 
            border: 2px solid #333; 
            background: #222; 
            color: #666; 
            font-size: 1.4rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            text-align: center;
        }
        
        .toggle-btn.on { 
            background: var(--danger); 
            color: white; 
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.4);
            animation: pulse 2s infinite;
        }

        #status-msg { 
            margin-top: 15px; 
            font-size: 0.75rem; 
            color: #333; 
            font-family: monospace; 
            text-align: center; 
        }

        #config-trigger { position: fixed; bottom: 10px; left: 10px; opacity: 0.1; cursor: pointer; z-index: 100; font-size: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(1.01); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
        
        #loader { 
            display:none; 
            position:absolute; 
            z-index:10; 
            background:rgba(0,0,0,0.8); 
            color:var(--accent); 
            padding:20px 40px; 
            border-radius:50px; 
            font-weight:bold; 
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <div id="loader">🎨 Generating...</div>
            <img id="result-img" src="">
        </div>

        <div class="ui-container">
            <div style="font-size: 0.7rem; color: #555; margin-bottom: 10px; letter-spacing: 2px;">LIVE TRANSCRIPT</div>
            <div id="transcript">Ready to Start</div>
            
            <div class="control-panel">
                <button id="toggle-btn" class="toggle-btn">AUTO GENERATION: OFF</button>
                <div id="status-msg">FLUX.1-SCHNELL | 1344 x 768 | 16:9</div>
            </div>
        </div>
    </div>

    <div id="config-trigger">⚙️</div>

    <script>
        const toggleBtn = document.getElementById('toggle-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');

        let isAutoMode = false;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;

        window.onload = () => {
            const key = localStorage.getItem('event_api_key');
            if (!key || key.length < 10) {
                transcriptDiv.textContent = "ℹ️ Setup Required\nPlease press [Shift + K] to configure API Key.";
                transcriptDiv.classList.add('warning');
            }
        };

        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key.toLowerCase() === 'k') openConfig();
            if (e.key === 'Enter') toggleBtn.click();
        });

        function openConfig() {
            const currentKey = localStorage.getItem('event_api_key') || "";
            const newKey = prompt("Together AIのAPIキーを入力してください:", currentKey);
            if (newKey !== null) {
                localStorage.setItem('event_api_key', newKey);
                location.reload();
            }
        }
        document.getElementById('config-trigger').onclick = openConfig;

        toggleBtn.onclick = () => {
            const key = localStorage.getItem('event_api_key');
            if (!key || key.length < 10) { openConfig(); return; }

            if (!isAutoMode) {
                isAutoMode = true;
                toggleBtn.textContent = "AUTO GENERATION: ON";
                toggleBtn.classList.add('on');
                resetStatus("Listening...");
                try { recognition.start(); } catch (e) {}
            } else {
                isAutoMode = false;
                toggleBtn.textContent = "AUTO GENERATION: OFF";
                toggleBtn.classList.remove('on');
                transcriptDiv.textContent = "System Paused";
                transcriptDiv.classList.remove('active', 'warning');
                recognition.stop();
            }
        };

        // 状態をリセットする関数（ここがポイント！）
        function resetStatus(text) {
            transcriptDiv.textContent = text;
            transcriptDiv.classList.remove('warning'); // 黄色を消す
            transcriptDiv.classList.add('active');    // 水色にする
        }

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
            }
            if (finalTranscript.trim().length > 0) {
                resetStatus(finalTranscript); // 新しい音声が入ったらリセット
                generateImage(finalTranscript);
            }
        };

        async function generateImage(promptText) {
            if (!isAutoMode) return;
            loader.style.display = 'block';
            try {
                const response = await fetch("https://api.together.xyz/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem('event_api_key')}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "black-forest-labs/FLUX.1-schnell",
                        prompt: promptText + ", masterpiece, high quality, 4k, cinematic",
                        width: 1344, height: 768, steps: 4, n: 1
                    })
                });

                const data = await response.json();
                if (data.data && data.data[0]) {
                    resultImg.src = data.data[0].url;
                    resultImg.classList.add('active');
                } else {
                    throw new Error();
                }
            } catch (e) {
                // エラー時のみ黄色くする
                transcriptDiv.textContent = "Oops! Try saying it again.";
                transcriptDiv.classList.add('warning');
                transcriptDiv.classList.remove('active');
            } finally {
                loader.style.display = 'none';
            }
        }

        recognition.onend = () => {
            if (isAutoMode) try { recognition.start(); } catch (e) {}
        };
    </script>
</body>
</html>
