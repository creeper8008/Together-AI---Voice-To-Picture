<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Painter - Exhibition Pro</title>
    <style>
        :root { --accent: #00f2fe; --bg: #000000; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        /* 16:9 画面構成 */
        .container { display: flex; height: 100vh; width: 100vw; }
        
        /* 左側：画像エリア（大きく配置） */
        .image-container { flex: 7; display: flex; align-items: center; justify-content: center; position: relative; background: #050505; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #result-img.active { display: block; animation: fadeIn 1s ease-in-out; }

        /* 右側：テキスト・操作エリア */
        .ui-container { flex: 3; background: #111; display: flex; flex-direction: column; padding: 40px; border-left: 1px solid #222; }
        
        #transcript { font-size: 2.5rem; font-weight: 800; line-height: 1.2; color: var(--accent); margin-bottom: 20px; flex-grow: 1; overflow-y: auto; }
        
        /* スタッフ操作ボタン */
        .control-panel { padding-top: 20px; border-top: 1px solid #333; }
        .action-btn { 
            width: 100%; padding: 25px; border-radius: 15px; border: none; 
            background: var(--accent); color: #000; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn.listening { background: #ff4b2b; color: white; animation: pulse 1.5s infinite; }

        #status-bar { margin-top: 15px; font-size: 0.8rem; color: #555; font-family: monospace; }

        /* 設定用ギア（目立たないように） */
        #config-trigger { position: fixed; bottom: 10px; left: 10px; opacity: 0.1; cursor: pointer; z-index: 100; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <div id="loader" style="display:none; position:absolute; font-size:1.5rem; color:var(--accent);">Generating...</div>
            <img id="result-img" src="">
        </div>

        <div class="ui-container">
            <div id="transcript">Ready to paint.</div>
            
            <div class="control-panel">
                <button id="action-btn" class="action-btn">PUSH TO START</button>
                <div id="status-bar">Together AI | FLUX.1-schnell | 1344x768</div>
            </div>
        </div>
    </div>

    <div id="config-trigger">⚙️</div>

    <script>
        const actionBtn = document.getElementById('action-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');
        const statusStr = document.getElementById('status-bar');

        let isListening = false;
        const apiKey = localStorage.getItem('event_api_key') || "";

        // 音声認識の設定
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = false; // 1回ごとに止める設定

        // ボタンが押されたとき
        actionBtn.onclick = () => {
            if (!isListening) {
                startListening();
            } else {
                stopListening();
            }
        };

        function startListening() {
            try {
                recognition.start();
                isListening = true;
                actionBtn.textContent = "LISTENING...";
                actionBtn.classList.add('listening');
                transcriptDiv.textContent = "I'm listening...";
                transcriptDiv.style.color = "#fff";
            } catch (e) { alert("Mic error: " + e.message); }
        }

        function stopListening() {
            recognition.stop();
            isListening = false;
            actionBtn.textContent = "PUSH TO START";
            actionBtn.classList.remove('listening');
        }

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript.trim();
            transcriptDiv.textContent = text;
            transcriptDiv.style.color = "var(--accent)";
            generateImage(text);
        };

        recognition.onend = () => {
            isListening = false;
            actionBtn.textContent = "PUSH TO START";
            actionBtn.classList.remove('listening');
        };

        async function generateImage(prompt) {
            loader.style.display = 'block';
            try {
                const response = await fetch("https://api.together.xyz/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem('event_api_key')}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "black-forest-labs/FLUX.1-schnell",
                        prompt: prompt + ", masterpiece, artistic, high quality, 4k, cinematically lit",
                        width: 1344, // 横長設定 (16:9)
                        height: 768, // 横長設定 (16:9)
                        steps: 4,
                        n: 1
                    })
                });

                const data = await response.json();
                if (data.data && data.data[0]) {
                    resultImg.src = data.data[0].url;
                    resultImg.classList.add('active');
                }
            } catch (e) {
                transcriptDiv.textContent = "Error: " + e.message;
            } finally {
                loader.style.display = 'none';
            }
        }

        // ギアアイコンでキー設定
        document.getElementById('config-trigger').onclick = () => {
            const key = prompt("Enter API Key:", localStorage.getItem('event_api_key') || "");
            if(key) localStorage.setItem('event_api_key', key);
        };
    </script>
</body>
</html>
