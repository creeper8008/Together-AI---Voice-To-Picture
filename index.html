<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Painter - Auto Mode</title>
    <style>
        :root { --accent: #00f2fe; --bg: #000000; --danger: #ff4b2b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        .container { display: flex; height: 100vh; width: 100vw; }
        
        /* 左側：巨大画像エリア */
        .image-container { flex: 7.5; display: flex; align-items: center; justify-content: center; position: relative; background: #050505; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #result-img.active { display: block; animation: fadeIn 0.8s ease; }

        /* 右側：制御パネル */
        .ui-container { flex: 2.5; background: #111; display: flex; flex-direction: column; padding: 30px; border-left: 1px solid #222; }
        
        #transcript { font-size: 2.2rem; font-weight: 800; line-height: 1.2; color: #666; margin-bottom: 20px; flex-grow: 1; overflow-y: auto; }
        #transcript.active { color: var(--accent); }

        .control-panel { padding-top: 20px; }
        
        /* トグルボタンのスタイル */
        .toggle-btn { 
            width: 100%; padding: 30px 20px; border-radius: 15px; border: 2px solid #333; 
            background: #222; color: #555; font-size: 1.4rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        /* ON状態のスタイル */
        .toggle-btn.on { 
            background: var(--danger); color: white; border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.4);
            animation: pulse 2s infinite;
        }

        #status-msg { margin-top: 15px; font-size: 0.8rem; color: #444; font-family: monospace; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 75, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <div id="loader" style="display:none; position:absolute; z-index:10; background:rgba(0,0,0,0.6); padding:20px; border-radius:10px;">🎨 Generating...</div>
            <img id="result-img" src="">
        </div>

        <div class="ui-container">
            <div id="status-label" style="font-size: 0.8rem; color: #444; margin-bottom: 5px;">LIVE TRANSCRIPT</div>
            <div id="transcript">System Paused</div>
            
            <div class="control-panel">
                <button id="toggle-btn" class="toggle-btn">AUTO GENERATION: OFF</button>
                <div id="status-msg">READY | TOGETHER AI | 16:9</div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');

        let isAutoMode = false;

        // 音声認識の設定
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.continuous = true; // ずっと聞き続ける
        recognition.interimResults = true; // 喋っている途中も表示する

        toggleBtn.onclick = () => {
            if (!isAutoMode) {
                startAutoMode();
            } else {
                stopAutoMode();
            }
        };

        function startAutoMode() {
            isAutoMode = true;
            toggleBtn.textContent = "AUTO GENERATION: ON";
            toggleBtn.classList.add('on');
            transcriptDiv.textContent = "Waiting for voice...";
            transcriptDiv.classList.add('active');
            
            try {
                recognition.start();
            } catch (e) { console.log("Already started"); }
        }

        function stopAutoMode() {
            isAutoMode = false;
            toggleBtn.textContent = "AUTO GENERATION: OFF";
            toggleBtn.classList.remove('on');
            transcriptDiv.textContent = "System Paused";
            transcriptDiv.classList.remove('active');
            
            recognition.stop();
        }

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                transcriptDiv.textContent = finalTranscript;
                generateImage(finalTranscript);
            }
        };

        async function generateImage(prompt) {
            if (!isAutoMode) return; // オフなら何もしない

            loader.style.display = 'block';
            try {
                const response = await fetch("https://api.together.xyz/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem('event_api_key')}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "black-forest-labs/FLUX.1-schnell",
                        prompt: prompt + ", high quality, detailed, 4k",
                        width: 1344,
                        height: 768,
                        steps: 4,
                        n: 1
                    })
                });

                const data = await response.json();
                if (data.data && data.data[0]) {
                    resultImg.src = data.data[0].url;
                    resultImg.classList.add('active');
                }
            } catch (e) {
                console.error("Gen Error:", e);
            } finally {
                loader.style.display = 'none';
            }
        }

        // 音声認識が途切れても自動復旧（ONのときのみ）
        recognition.onend = () => {
            if (isAutoMode) recognition.start();
        };

    </script>
</body>
</html>
