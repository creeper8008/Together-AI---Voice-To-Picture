<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Painter - Exhibition Edition</title>
    <style>
        :root { --accent: #00ffcc; --bg: #0a0a0c; --panel: #16161a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* 展示用レイアウト */
        .main-container { width: 90vw; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
        
        .voice-section { text-align: left; }
        .image-section { position: relative; width: 100%; aspect-ratio: 1/1; background: #111; border-radius: 20px; box-shadow: 0 0 50px rgba(0, 255, 204, 0.2); border: 1px solid #333; overflow: hidden; }
        
        #generated-image { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; opacity: 0; }
        #generated-image.loaded { opacity: 1; }

        h1 { font-size: 3rem; margin: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        #transcript { font-size: 1.8rem; margin: 20px 0; min-height: 3em; color: #ccc; line-height: 1.4; }
        
        .start-btn { background: var(--accent); color: black; border: none; padding: 20px 60px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }
        .start-btn:disabled { background: #333; color: #666; cursor: default; transform: none; box-shadow: none; }

        /* 装飾的なログ */
        .status-tag { display: inline-block; padding: 5px 15px; background: #222; border-radius: 5px; font-family: monospace; font-size: 0.9rem; color: var(--accent); margin-bottom: 10px; }
        
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 3px solid #333; border-top: 3px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="voice-section">
            <div class="status-tag" id="status">SYSTEM: READY</div>
            <h1>AI Voice<br>Visualizer</h1>
            <div id="transcript">Click START and speak English...</div>
            <button id="start-btn" class="start-btn">START SESSION</button>
        </div>

        <div class="image-section">
            <div id="loader" class="loader"></div>
            <img id="generated-image" src="" alt="">
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const transcriptDiv = document.getElementById('transcript');
        const imageImg = document.getElementById('generated-image');
        const loader = document.getElementById('loader');
        const statusTag = document.getElementById('status');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Please use Google Chrome!");
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;

        startBtn.onclick = () => {
            recognition.start();
            startBtn.disabled = true;
            startBtn.textContent = "LISTENING...";
            statusTag.textContent = "SYSTEM: MIC ACTIVE";
        };

        recognition.onresult = (event) => {
            const text = event.results[event.results.length - 1][0].transcript.trim();
            if (text.length < 3) return;
            
            transcriptDiv.textContent = text;
            statusTag.textContent = "SYSTEM: GENERATING...";
            generateImage(text);
        };

        async function generateImage(prompt) {
            loader.style.display = 'block';
            imageImg.classList.remove('loaded');

            // --- Pollinations.ai (Fluxモデル) を使用 ---
            // キー不要、CORS制限なし、非常に高速
            const seed = Math.floor(Math.random() * 999999);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true&model=flux`;

            // 画像のプリロード（読み込みが完了してから表示させる）
            const imgTemp = new Image();
            imgTemp.src = imageUrl;
            imgTemp.onload = () => {
                imageImg.src = imageUrl;
                imageImg.classList.add('loaded');
                loader.style.display = 'none';
                statusTag.textContent = "SYSTEM: SUCCESS";
            };
        }

        recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
        recognition.onerror = (e) => { statusTag.textContent = "ERROR: " + e.error; };
    </script>
</body>
</html>
