<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant AI Painter - SiliconFlow Edition</title>
    <style>
        :root { --accent: #00ffcc; --bg: #0d1117; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        .container { width: 90vw; max-width: 800px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: var(--accent); letter-spacing: 1px; font-weight: 800; }
        span { color: #fff; }

        /* キー入力エリア */
        .setup-box { background: #161b22; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #30363d; }
        input { background: #000; border: 1px solid #444; color: var(--accent); padding: 12px; border-radius: 6px; width: 320px; font-family: monospace; font-size: 0.9rem; }
        
        /* 音声テキスト表示 */
        #transcript { font-size: 2.2rem; font-weight: bold; margin: 25px 0; min-height: 1.5em; color: #fff; line-height: 1.2; }
        
        /* 画像表示エリア */
        .stage { position: relative; width: 100%; max-width: 512px; aspect-ratio: 1/1; margin: auto; background: #000; border-radius: 20px; overflow: hidden; border: 2px solid #30363d; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #result-img.active { display: block; animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 操作ボタン */
        .btn { background: var(--accent); color: #000; border: none; padding: 18px 60px; border-radius: 50px; font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3); }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--accent); }
        .btn:disabled { background: #333; color: #666; cursor: default; transform: none; box-shadow: none; }

        /* ログ・ステータス */
        #status-log { margin-top: 20px; font-size: 0.85rem; color: #8b949e; font-family: monospace; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; width: 100%; max-width: 512px; margin-left: auto; margin-right: auto; }

        /* ローディング */
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); border-radius: 50%; width: 60px; height: 60px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI <span>VOICE PAINTER</span></h1>

        <div class="setup-box">
            <input type="password" id="api-key" placeholder="Paste SiliconFlow Key (sk-...)">
            <div style="font-size: 0.7rem; color: #666; margin-top: 8px;">1ドル分のボーナスを使用します。キーはブラウザにのみ保存されます。</div>
        </div>

        <button id="start-btn" class="btn">START EXHIBITION</button>
        
        <div id="transcript">Ready...</div>

        <div class="stage">
            <div id="loader" class="loader"></div>
            <img id="result-img" src="">
        </div>

        <div id="status-log">System: Waiting for Start button...</div>
    </div>

    <script>
        const keyInput = document.getElementById('api-key');
        const startBtn = document.getElementById('start-btn');
        const transcriptDiv = document.getElementById('transcript');
        const resultImg = document.getElementById('result-img');
        const loader = document.getElementById('loader');
        const statusLog = document.getElementById('status-log');

        // 前回のキーを復元
        keyInput.value = localStorage.getItem('sf_key_final') || '';

        // 音声認識の設定
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) alert("Chromeブラウザを使用してください。");
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;

        startBtn.onclick = () => {
            const key = keyInput.value.trim();
            if (!key.startsWith('sk-')) {
                updateStatus("Error: APIキーを正しく入力してください (sk-...)");
                return;
            }
            localStorage.setItem('sf_key_final', key);
            
            try {
                recognition.start();
                startBtn.disabled = true;
                startBtn.textContent = "🎤 LISTENING";
                updateStatus("System: Microphone Active. Speak in English!");
            } catch(e) {
                updateStatus("Error: " + e.message);
            }
        };

        recognition.onresult = (event) => {
            const text = event.results[event.results.length - 1][0].transcript.trim();
            if (text.length < 2) return;
            transcriptDiv.textContent = text;
            generateImage(text);
        };

        async function generateImage(prompt) {
            loader.style.display = 'block';
            const startTime = performance.now();
            const apiKey = keyInput.value.trim();

            updateStatus("System: Calling SiliconFlow API...");

            try {
                const response = await fetch("https://api.siliconflow.cn/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // 高画質・爆速のFLUXモデルを使用
                        model: "black-forest-labs/FLUX.1-schnell", 
                        prompt: prompt + ", high quality, detailed masterpiece",
                        image_size: "1024x1024",
                        batch_size: 1,
                        num_inference_steps: 4 
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error("API Error Detail:", errorData);
                    
                    if (response.status === 401) {
                        throw new Error("401 Unauthorized: APIキーが間違っているか、ボーナスが未有効です。");
                    } else if (response.status === 404) {
                        throw new Error("404 Not Found: エンドポイントURLが変更された可能性があります。");
                    } else {
                        throw new Error(`API Error ${response.status}: ${errorData.message || 'Unknown'}`);
                    }
                }

                const data = await response.json();
                
                if (data.images && data.images[0].url) {
                    resultImg.src = data.images[0].url;
                    resultImg.classList.add('active');
                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    updateStatus(`Success: Generated in ${duration}s using FLUX.1-schnell`);
                } else {
                    throw new Error("画像データが空でした。");
                }

            } catch (e) {
                updateStatus("Error: " + e.message);
                console.error(e);
            } finally {
                loader.style.display = 'none';
            }
        }

        // ログ更新関数
        function updateStatus(msg) {
            statusLog.textContent = msg;
            console.log(msg);
        }

        // 音声認識の自動再開
        recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
    </script>
</body>
</html>
