<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI English Visualizer</title>
    <style>
        :root { --primary: #007bff; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        input[type="password"] { width: 95%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        #transcript { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; min-height: 1.5em; border-bottom: 2px solid #eee; }
        #image-container { width: 100%; aspect-ratio: 1/1; background: #ddd; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn:disabled { background: #ccc; }
        .status { font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI English Visualizer</h2>
    
    <div class="input-group">
        <label>Hugging Face Token (hf_...):</label>
        <input type="password" id="hf-token" placeholder="Paste your token here">
    </div>

    <button id="start-btn" class="btn">Start Listening</button>
    <div id="status" class="status">Enter token and click Start</div>
    
    <div id="transcript">Speech will appear here...</div>
    
    <div id="image-container">
        <img id="generated-image" style="display:none;">
        <div id="loader" style="display:none;">Generating...</div>
    </div>
</div>

<script>
    const hfInput = document.getElementById('hf-token');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript');
    const imageImg = document.getElementById('generated-image');
    const loader = document.getElementById('loader');

    // 保存されているトークンがあれば読み込む
    hfInput.value = localStorage.getItem('hf_token_saved') || '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("お使いのブラウザは音声認識をサポートしていません。Chromeを使用してください。");
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;

    startBtn.onclick = () => {
        const token = hfInput.value.trim();
        if (!token) {
            alert("トークンを入力してください");
            return;
        }
        // トークンを保存
        localStorage.setItem('hf_token_saved', token);
        
        try {
            recognition.start();
            statusDiv.textContent = "Connecting to Microphone...";
        } catch (e) {
            statusDiv.textContent = "Error: " + e.message;
        }
    };

    recognition.onstart = () => {
        startBtn.disabled = true;
        startBtn.textContent = "Listening...";
        statusDiv.textContent = "Microphone ON: Speak English!";
    };

    recognition.onerror = (event) => {
        statusDiv.textContent = "Speech Error: " + event.error;
        if (event.error === 'not-allowed') {
            alert("マイクの使用が許可されていません。ブラウザのアドレスバーの鍵アイコンから許可してください。");
        }
    };

    recognition.onresult = async (event) => {
        const text = event.results[event.results.length - 1][0].transcript.trim();
        transcriptDiv.textContent = text;
        generateImage(text);
    };

    async function generateImage(prompt) {
        const token = hfInput.value.trim().replace(/[^\x21-\x7E]/g, "");
        loader.style.display = 'block';
        imageImg.style.display = 'none';
        
        try {
            const response = await fetch(
                "https://api-inference.huggingface.co/models/stabilityai/sdxl-turbo",
                {
                    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({ inputs: prompt }),
                }
            );

            if (response.status === 503) {
                statusDiv.textContent = "Model is starting up... waiting 5s";
                setTimeout(() => generateImage(prompt), 5000);
                return;
            }

            if (!response.ok) throw new Error("API Error: " + response.status);

            const blob = await response.blob();
            imageImg.src = URL.createObjectURL(blob);
            imageImg.style.display = 'block';
            loader.style.display = 'none';
            statusDiv.textContent = "Image Generated!";
        } catch (e) {
            statusDiv.textContent = "Gen Error: " + e.message;
            loader.style.display = 'none';
        }
    }

    recognition.onend = () => { if(startBtn.disabled) recognition.start(); };
</script>
</body>
</html>
