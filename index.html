<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Debug AI Visualizer</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; }
        #debug-log { background: #000; color: #0f0; text-align: left; padding: 10px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; margin-top: 20px; border-radius: 5px; }
        #transcript { font-size: 1.5rem; color: #ff5722; margin: 20px; }
        img { width: 100%; max-width: 400px; display: none; margin-top: 10px; border-radius: 8px; }
        .btn { background: #ff5722; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>AI Visualizer (Debug Mode)</h2>
        <input type="password" id="fal-key" placeholder="Enter Fal.ai Key (fal_...)">
        <button id="start-btn" class="btn">START SESSION</button>
        
        <div id="transcript">Ready...</div>
        <img id="generated-image">
        
        <div id="debug-log">--- System Log ---<br></div>
    </div>

    <script>
        const log = (msg) => {
            const div = document.getElementById('debug-log');
            div.innerHTML += `> ${msg}<br>`;
            div.scrollTop = div.scrollHeight;
            console.log(msg);
        };

        window.onerror = (msg) => log("Runtime Error: " + msg);

        const startBtn = document.getElementById('start-btn');
        const keyInput = document.getElementById('fal-key');
        const imageImg = document.getElementById('generated-image');
        const transcriptDiv = document.getElementById('transcript');

        // キーの復元
        keyInput.value = localStorage.getItem('fal_api_key_debug') || '';
        log("Page loaded. URL: " + location.href);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            log("ERROR: Your browser does not support SpeechRecognition.");
        }

        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.lang = 'en-US';
            recognition.continuous = true;
            log("Speech recognition initialized.");
        }

        startBtn.onclick = () => {
            log("Start button clicked.");
            const key = keyInput.value.trim();
            
            if (!key) {
                log("Alert: Key is missing.");
                alert("Please enter Fal API Key!");
                return;
            }
            
            localStorage.setItem('fal_api_key_debug', key);
            log("Key saved to localStorage.");

            try {
                log("Attempting to start microphone...");
                recognition.start();
            } catch (e) {
                log("Start Error: " + e.message);
            }
        };

        if (recognition) {
            recognition.onstart = () => {
                log("SUCCESS: Microphone is now ON.");
                startBtn.disabled = true;
                startBtn.textContent = "Listening...";
            };

            recognition.onerror = (event) => {
                log("Mic Error event: " + event.error);
            };

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript.trim();
                transcriptDiv.textContent = text;
                log(`Heard: "${text}"`);
                generateImage(text);
            };

            recognition.onend = () => {
                log("Mic connection ended.");
                if (startBtn.disabled) {
                    log("Auto-restarting mic...");
                    recognition.start();
                }
            };
        }

        async function generateImage(prompt) {
            log("Sending request to Fal.ai...");
            try {
                const response = await fetch("https://queue.fal.run/fal-ai/fast-sdxl", {
                    method: "POST",
                    headers: {
                        "Authorization": `Key ${keyInput.value.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: prompt, sync_mode: true })
                });

                if (!response.ok) throw new Error("API " + response.status);

                const data = await response.json();
                if (data.images && data.images[0]) {
                    imageImg.src = data.images[0].url;
                    imageImg.style.display = 'block';
                    log("Image displayed!");
                }
            } catch (e) {
                log("Fetch Error: " + e.message);
            }
        }
    </script>
</body>
</html>
