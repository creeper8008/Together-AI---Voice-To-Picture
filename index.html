<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Voice AI Canvas - Triple Engine</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #container { background: var(--card); padding: 30px; border-radius: 28px; width: 90%; max-width: 500px; text-align: center; border: 1px solid #334155; }
        #hf-token { background: #0f172a; border: 1px solid #334155; color: var(--primary); font-size: 11px; padding: 10px; border-radius: 12px; width: 80%; margin-bottom: 20px; }
        #btn { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); color: white; border: none; padding: 22px; border-radius: 18px; font-size: 22px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        #btn.listening { background: #ef4444; animation: pulse 1s infinite; }
        #transcript-box { min-height: 70px; font-size: 20px; margin: 20px 0; color: #e2e8f0; font-weight: 300; }
        #status-msg { font-size: 12px; color: #94a3b8; margin-bottom: 10px; font-family: monospace; }
        #img-container { width: 100%; aspect-ratio: 1/1; background: #0f172a; border-radius: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #334155; }
        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .loader { width: 40px; height: 40px; border: 4px solid #334155; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="container">
    <input type="password" id="hf-token" placeholder="Hugging Face Token (Required)">
    <button id="btn">🎤 CLICK TO SPEAK</button>
    <div id="transcript-box">"A majestic mountain landscape"</div>
    <div id="status-msg">Ready</div>
    <div id="img-container">
        <div id="loader" class="loader" style="display:none;"></div>
        <img id="result-img" src="" alt="Result">
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const statusMsg = document.getElementById('status-msg');
    const transcriptDiv = document.getElementById('transcript-box');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');
    const hfTokenInput = document.getElementById('hf-token');

    hfTokenInput.value = localStorage.getItem('hf_token_cache') || '';
    hfTokenInput.onchange = () => localStorage.setItem('hf_token_cache', hfTokenInput.value);

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new Speech();
    recognition.lang = 'en-US';

    btn.onclick = () => { if(!hfTokenInput.value) return alert("HF Token is required"); recognition.start(); btn.classList.add('listening'); };
    recognition.onresult = (e) => { const text = e.results[0][0].transcript; transcriptDiv.textContent = `"${text}"`; generateStage1(text); };
    recognition.onend = () => btn.classList.remove('listening');

    // --- 第1段階: FLUX (最高画質) ---
    async function generateStage1(prompt) {
        setUIState("🛰️ Stage 1: Trying FLUX...");
        try {
            const blob = await fetchHF("black-forest-labs/FLUX.1-schnell", prompt);
            if (blob) return displayImage(URL.createObjectURL(blob), "✨ Engine: FLUX (Hugging Face)");
            throw new Error("Stage 1 Failed");
        } catch (e) {
            generateStage2(prompt);
        }
    }

    // --- 第2段階: Stable Diffusion XL (高画質・軽量) ---
    async function generateStage2(prompt) {
        setUIState("🔄 Stage 2: Switching to SDXL...");
        try {
            const blob = await fetchHF("stabilityai/stable-diffusion-xl-base-1.0", prompt);
            if (blob) return displayImage(URL.createObjectURL(blob), "✅ Engine: SDXL (Hugging Face)");
            throw new Error("Stage 2 Failed");
        } catch (e) {
            generateStage3(prompt);
        }
    }

    // --- 第3段階: Pollinations (絶対安心) ---
    function generateStage3(prompt) {
        setUIState("🚑 Stage 3: Emergency Fallback...");
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${Math.floor(Math.random()*1000)}&nologo=true`;
        const img = new Image();
        img.src = url;
        img.onload = () => displayImage(url, "🏁 Engine: Pollinations (Fallback)");
        img.onerror = () => { statusMsg.textContent = "❌ All Engines Offline"; loader.style.display = 'none'; };
    }

    async function fetchHF(model, prompt) {
        const response = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
            headers: { Authorization: `Bearer ${hfTokenInput.value}`, "Content-Type": "application/json" },
            method: "POST",
            body: JSON.stringify({ inputs: prompt }),
        });
        if (response.status === 503) { // 起動待ちなら少し待機して再試行
            await new Promise(r => setTimeout(r, 3000));
            return fetchHF(model, prompt);
        }
        if (!response.ok) return null;
        return await response.blob();
    }

    function setUIState(msg) {
        statusMsg.textContent = msg;
        resultImg.style.display = 'none';
        loader.style.display = 'block';
    }

    function displayImage(url, msg) {
        resultImg.src = url;
        resultImg.style.display = 'block';
        loader.style.display = 'none';
        statusMsg.textContent = msg;
    }
</script>
</body>
</html>
